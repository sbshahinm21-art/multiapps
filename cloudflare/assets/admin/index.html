<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Multi Apps — Admin</title>
  <link rel="stylesheet" href="/admin/app.css">
  <script src="/admin/app.js" defer></script>
</head>
<body>
  <div id="auth" class="auth hidden">
    <div class="auth-card">
      <div class="brand"><span class="logo">M</span><span>Multi Apps <small>Admin</small></span></div>
      <div id="auth-body"></div>
    </div>
  </div>

  <div id="shell" class="shell hidden">
    <aside class="sidebar" id="sidebar">
      <div class="brand"><span class="logo">M</span><span>Multi Apps <small>Admin</small></span></div>
      <nav id="nav">
        <a data-view="overview">Overview</a>
        <a data-view="releases">Release Center</a>
        <a data-view="testers">Beta Testers</a>
        <a data-view="stats">Update Statistics</a>
        <a data-view="config">Remote Settings &amp; Ads</a>
        <a data-view="site">Website Content</a>
        <a data-view="support">Support Tickets</a>
        <a data-view="audit">Audit Log</a>
        <a data-view="account">Account &amp; Security</a>
      </nav>
      <div class="sidebar-foot">
        <span id="whoami"></span>
        <button class="btn ghost small" id="logout">Sign out</button>
      </div>
    </aside>
    <main class="main">
      <header class="topbar">
        <button class="btn ghost small menu-btn" id="menu-btn" aria-label="Menu">☰</button>
        <h1 id="view-title"></h1>
      </header>
      <section id="view"></section>
    </main>
  </div>
  <div id="toast" class="toast hidden"></div>
  <div id="modal" class="modal hidden"><div class="modal-card" id="modal-card"></div></div>
</body>
</html>
